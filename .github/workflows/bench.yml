name: bench
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC
permissions:
  contents: write
concurrency:
  group: bench
  cancel-in-progress: false
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install lanes
        run: |
          command -v /usr/bin/time || sudo apt-get install -y time
          uv sync --project impl/python --frozen
          npm ci --prefix impl/typescript
          npm run build --prefix impl/typescript
      - name: Contract tests
        run: python -m unittest discover -s tests -v
      - name: Measure
        run: python runner/run.py
      - name: Build site data
        run: python runner/build_site.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results site/data.json
          git diff --cached --quiet || git commit -m "results: $(date -u +%Y-%m-%d) github-hosted run"
          git push
