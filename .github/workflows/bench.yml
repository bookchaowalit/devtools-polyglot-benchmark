name: bench
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC
permissions:
  contents: write
concurrency:
  group: bench
  cancel-in-progress: false
jobs:
  bench:
    # One job per lane group. A variant group also runs its parent lane, so
    # each comparison is made on one VM; groups run in parallel on different VMs.
    strategy:
      fail-fast: false
      matrix:
        group: [core, python-variants, typescript-variants]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bench
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: impl/go/go.mod
          cache-dependency-path: impl/go/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install lanes
        run: |
          command -v /usr/bin/time || sudo apt-get install -y time
          uv sync --project impl/python --frozen
          UV_PROJECT_ENVIRONMENT=$PWD/impl/python/.venv313 uv sync --project impl/python --python 3.13 --frozen
          npm ci --prefix impl/typescript
          npm run build --prefix impl/typescript
          (cd impl/go && go build -o bin/ ./cmd/...)
          (cd impl/rust && cargo build --release --locked)
      - name: Seed database
        run: impl/python/.venv/bin/python runner/seed_db.py
      - name: Contract tests
        run: python -m unittest discover -s tests -v
      - name: Measure
        run: python runner/run.py --group ${{ matrix.group }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: results-${{ matrix.group }}
          # .gitkeep keeps results/ as the common root, so the run folder name survives the upload
          path: |
            results/.gitkeep
            results/*-${{ matrix.group }}/
          if-no-files-found: error

  publish:
    needs: bench
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - name: Build site data
        run: python3 runner/build_site.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results site/data.json
          git diff --cached --quiet || git commit -m "results: $(date -u +%Y-%m-%d) github-hosted run"
          # main may have moved while the bench jobs ran
          git pull --rebase origin main
          git push
