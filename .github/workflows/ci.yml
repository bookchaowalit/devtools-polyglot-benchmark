# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# The lanes' contract tests stay in contract.yml (they need PostgreSQL and all four toolchains);
# bench.yml (benchmark + results publishing) is unchanged.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      python-version: "3.12" # as contract.yml / bench.yml
      # Ruff over every Python file (runner, contract, tests, impl/python). The tests start the
      # Python, TypeScript, Go and Rust servers against PostgreSQL, so they run in contract.yml.
      install-command: ""
      test-command: ""

  typescript:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      working-directory: impl/typescript
      node-version: "22"
      lint-command: "" # no Biome/ESLint config; tsc --noEmit still runs
      build-command: npm run build

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
