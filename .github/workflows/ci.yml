name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install lanes
        run: |
          command -v /usr/bin/time || sudo apt-get install -y time
          uv sync --project impl/python --frozen
          npm ci --prefix impl/typescript
          npm run build --prefix impl/typescript
      - name: Contract tests
        run: python -m unittest discover -s tests -v
      - name: Smoke run (not published)
        run: python runner/run.py --quick --out .cache/quick
