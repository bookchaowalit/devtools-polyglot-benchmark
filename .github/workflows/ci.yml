# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# The lanes' contract tests stay in contract.yml (they need PostgreSQL and all four toolchains);
# bench.yml (benchmark + results publishing) is unchanged.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: "3.12" # as contract.yml / bench.yml
      # Ruff over every Python file (runner, contract, tests, impl/python). test_contract.py starts
      # the Python, TypeScript, Go and Rust servers against PostgreSQL, so it runs in contract.yml;
      # the stdlib-only unit tests (lane registry, site builder, summary maths) also run here.
      install-command: ""
      test-command: python3 -m unittest -v tests.test_lanes tests.test_build_site tests.test_run_helpers

  typescript:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: impl/typescript
      node-version: "22"
      lint-command: "" # no Biome/ESLint config; tsc --noEmit still runs
      build-command: npm run build

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
