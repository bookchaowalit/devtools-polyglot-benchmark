[package]
name = "lane-rust-axum"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
# No default features: the benchmark uses no cookies, compression or TLS, and the cookie
# feature pulls cookie 0.16 (RUSTSEC-2026-0594, fixed only in 0.18.3).
actix-web = { version = "4", default-features = false, features = ["macros"] }

[profile.release]
codegen-units = 1
lto = "thin"
