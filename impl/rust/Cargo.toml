[package]
name = "lane-rust-axum"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio-postgres = "0.7"
deadpool-postgres = "0.14"

[profile.release]
codegen-units = 1
lto = "thin"
