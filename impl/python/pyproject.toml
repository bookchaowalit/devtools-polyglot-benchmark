[project]
name = "lane-python-fastapi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4",
  # variant-only dependencies; the baseline never imports them
  "uvloop>=0.21", "httptools>=0.6", "orjson>=3.10", "asyncpg>=0.30",
]

[tool.uv]
package = false
